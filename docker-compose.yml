# Moonshine service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:9240)
# Scale:  MOONSHINE_REPLICAS=3 docker compose up -d --build, then: docker compose restart moonshine_lb

name: moonshine

services:
  moonshine:
    build: .
    restart: unless-stopped
    mem_limit: ${MOONSHINE_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      MOONSHINE_ADMIN_PASSWORD: ${MOONSHINE_ADMIN_PASSWORD:-}
      MOONSHINE_NUM_THREAD: ${MOONSHINE_NUM_THREAD:-}
      MOONSHINE_REPLICAS: ${MOONSHINE_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - models:/models
      - tokens:/data
    deploy:
      replicas: ${MOONSHINE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9240/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [moonshine]

  moonshine_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${MOONSHINE_PORT:-9240}:9240"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      moonshine:
        condition: service_healthy
    networks: [moonshine]

volumes:
  models:
  tokens:

networks:
  # Other stacks reach http://moonshine_lb:9240 by joining this network.
  moonshine:
